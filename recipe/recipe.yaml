context:
  version: "0.5.0"

package:
  name: fastpotify
  version: ${{ version }}

source:
  url: https://github.com/crmne/fastpotify/archive/refs/tags/v${{ version }}.tar.gz
  sha256: ed498e33283937de57f883987bd60d65b275572d2d17ad88d922bc22275c440c

build:
  number: 0
  script:
    interpreter: brush
    env:
      CARGO_PROFILE_RELEASE_LTO: fat
      CARGO_PROFILE_RELEASE_STRIP: symbols
    content:
      - cargo auditable install --locked --no-track --bins --root "${LIBRARY_PREFIX:-$PREFIX}" --path .
      - mkdir -p "$PREFIX/Menu"
      - cp "$RECIPE_DIR/menu.json" "$PREFIX/Menu/fastpotify.json"
      - if: linux
        then: cp packaging/macos/icon-1024.png "$PREFIX/Menu/fastpotify.png"
      - if: osx
        then:
          - bash packaging/macos/bundle.sh "$PREFIX/bin/fastpotify" Fastpotify.app "$PKG_VERSION"
          - cp Fastpotify.app/Contents/Resources/fastpotify.icns "$PREFIX/Menu/fastpotify.icns"
      - if: win
        then: cp packaging/windows/fastpotify.ico "$PREFIX/Menu/fastpotify.ico"
      - cargo-bundle-licenses --format yaml --output ./THIRDPARTY.yml

requirements:
  build:
    - ${{ stdlib('c') }}
    - ${{ compiler('c') }}
    - ${{ compiler('rust') }}
    - brush
    - cargo-auditable
    - cargo-bundle-licenses
    - if: linux
      then: pkg-config
  host:
    - if: linux
      then:
        - alsa-lib
        - libxkbcommon
        - pulseaudio-client
        - wayland
        - xorg-libx11
  run:
    - if: linux
      then:
        - libgl
        - xorg-libxcursor
        - xorg-libxi
        - xorg-libxrandr

tests:
  - script:
      - fastpotify --help
  - package_contents:
      bin:
        - fastpotify
      files:
        - Menu/fastpotify.*
      strict: true

about:
  homepage: https://fastpotify.rocks
  summary: Fast, lightweight, native Spotify client
  description: |
    Fastpotify is a native Spotify client with local playback, Spotify
    Connect, media-key integration, and system tray support.
  license: MIT
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  repository: https://github.com/crmne/fastpotify

extra:
  recipe-maintainers:
    - baszalmstra
