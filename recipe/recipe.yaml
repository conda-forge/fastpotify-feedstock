context:
  version: "0.12.0"

package:
  name: fastpotify
  version: ${{ version }}

source:
  url: https://github.com/crmne/spotifast/archive/refs/tags/v${{ version }}.tar.gz
  sha256: c65cb55ac0ef499d92eaa7cd795de48f22cc7050237c427e7e7430f3ebb941e6

build:
  number: 0
  script:
    interpreter: brush
    env:
      CARGO_PROFILE_RELEASE_LTO: fat
      CARGO_PROFILE_RELEASE_STRIP: symbols
    content:
      - if: linux
        then:
          - export BINDGEN_EXTRA_CLANG_ARGS="--sysroot=$CONDA_BUILD_SYSROOT"
          - export CMAKE_TOOLCHAIN_FILE="$RECIPE_DIR/projectm-toolchain.cmake"
      - if: unix
        then: LIBCLANG_PATH="$BUILD_PREFIX/lib" cargo auditable install --locked --no-track --bins --root "${LIBRARY_PREFIX:-$PREFIX}" --path .
        else: cargo auditable install --locked --no-track --no-default-features --bins --root "${LIBRARY_PREFIX:-$PREFIX}" --path .
      - mkdir -p "$PREFIX/Menu"
      - cp "$RECIPE_DIR/menu.json" "$PREFIX/Menu/spotifast.json"
      - if: linux
        then: cp packaging/macos/icon-1024.png "$PREFIX/Menu/spotifast.png"
      - if: osx
        then:
          - bash packaging/macos/bundle.sh "$PREFIX/bin/spotifast" Spotifast.app "$PKG_VERSION"
          - cp Spotifast.app/Contents/Resources/spotifast.icns "$PREFIX/Menu/spotifast.icns"
      - if: win
        then: cp packaging/windows/spotifast.ico "$PREFIX/Menu/spotifast.ico"
      - cargo-bundle-licenses --format yaml --output ./THIRDPARTY.yml

requirements:
  build:
    - ${{ stdlib('c') }}
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - ${{ compiler('rust') }}
    - cmake
    - brush
    - cargo-auditable
    - cargo-bundle-licenses
    - if: unix
      then: libclang
    - if: linux
      then:
        - clangdev
        - make
        - pkg-config
    - if: win
      then: uutils-coreutils
  host:
    - if: linux
      then:
        - alsa-lib
        - libgl-devel
        - libxkbcommon
        - pulseaudio-client
        - wayland
        - xorg-libx11
        - xorg-xorgproto
  run:
    - if: linux
      then:
        - xorg-libxcursor
        - xorg-libxi
        - xorg-libxrandr

tests:
  - script:
      - spotifast --help
  - package_contents:
      bin:
        - spotifast
      files:
        - Menu/spotifast.*
      strict: true

about:
  homepage: https://spotifast.rocks
  summary: Fast, lightweight, native Spotify client
  description: |
    Spotifast, formerly Fastpotify, is a native Spotify client with local
    playback, Spotify Connect, media-key integration, and system tray support.
    Both the spotifast and fastpotify commands are included.
  license: MIT
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  repository: https://github.com/crmne/spotifast

extra:
  recipe-maintainers:
    - lucascolley
    - baszalmstra
